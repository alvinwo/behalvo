name: Kernel checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.19.0', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - name: Retain verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-node-${{ matrix.node }}
          path: data/verification/
          if-no-files-found: error
